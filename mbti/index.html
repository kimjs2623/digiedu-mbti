<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons (Phosphor, FontAwesome 대신 경량 아이콘 사용) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 커스텀 라디오 버튼 스타일링을 위한 CSS */
    input[type="radio"]:checked + div {
      border-color: #d946ef; /* fuchsia-500 */
      background-color: #fdf4ff; /* fuchsia-50 */
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    input[type="radio"]:checked + div .radio-inner {
      border-color: #d946ef;
    }
    input[type="radio"]:checked + div .radio-dot {
      display: block;
      background-color: #d946ef;
    }
    /* 옵션 B용 커스텀 컬러 (Cyan) */
    input[type="radio"].cyan-radio:checked + div {
      border-color: #06b6d4; /* cyan-500 */
      background-color: #ecfeff; /* cyan-50 */
    }
    input[type="radio"].cyan-radio:checked + div .radio-inner {
      border-color: #06b6d4;
    }
    input[type="radio"].cyan-radio:checked + div .radio-dot {
      background-color: #06b6d4;
    }
    
    /* 페이드 인 애니메이션 */
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

    const appContainer = document.getElementById('app-container');

    // 화면을 상태에 따라 다시 그리는 함수
    function render() {
      appContainer.innerHTML = ''; // 컨테이너 비우기

      if (currentStep === 'intro') {
        renderIntro();
      } else if (currentStep === 'quiz') {
        renderQuiz();
      } else if (currentStep === 'result') {
        renderResult();
      }

      // Lucide 아이콘 다시 그리기 (동적 생성 요소에 적용)
      lucide.createIcons();
    }

          </button>

    // 2. 퀴즈 화면 렌더링

            <div class="flex items-start mb-6">

              </div>
              <h3 class="text-xl font-bold text-slate-800 leading-snug">
                ${q.question}
              </h3>
            </div>

              <label class="relative cursor-pointer h-full block">
                <input 
                  type="radio" 
                  name="q-${q.id}" 
                  class="sr-only fuchsia-radio"
                  value="${q.optionA.value}"
                  onchange="handleSelect(${q.id}, '${q.optionA.value}')"
                  ${isCheckedA}
                />

                      <div class="radio-dot w-2.5 h-2.5 rounded-full hidden transition-colors"></div>
                    </span>
                  </div>
                  <p class="text-slate-700 font-medium text-lg leading-relaxed flex-grow">
                    ${q.optionA.text}
                  </p>
                </div>
              </label>

                <input 
                  type="radio" 
                  name="q-${q.id}" 
                  class="sr-only cyan-radio"
                  value="${q.optionB.value}"
                  onchange="handleSelect(${q.id}, '${q.optionB.value}')"
                  ${isCheckedB}

              총 ${QUESTIONS.length}개의 질문 중 내가 더 끌리는 대답을 콕! 찍어주세요.

            <button 
              onclick="calculateResult()"
              class="inline-flex items-center justify-center px-10 py-5 text-xl font-bold text-white transition-all transform rounded-full bg-gradient-to-r from-violet-600 via-fuchsia-500 to-cyan-500 hover:scale-105 hover:shadow-xl hover:shadow-fuchsia-500/30 w-full sm:w-auto"
            >
              <i data-lucide="check-circle-2" class="w-6 h-6 mr-2"></i>
              나의 MBTI 결과 보기!
            </button>
          </div>
        </div>
      `;
      appContainer.innerHTML = html;
    }

    // 3. 결과 화면 렌더링
    function renderResult() {
      const resultData = MBTI_RESULTS[finalMbti];
      if (!resultData) return;

      const html = `
        <div class="fade-in bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
          <!-- 결과 상단 헤더 (Canva 스타일 화려한 배경) -->
          <div class="bg-gradient-to-br from-violet-600 via-fuchsia-500 to-cyan-500 p-10 text-center text-white relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-20" style="background-image: url('data:image/svg+xml,%3Csvg width=\\'20\\' height=\\'20\\' viewBox=\\'0 0 20 20\\' xmlns=\\'http://www.w3.org/2000/svg\\'%3E%3Cg fill=\\'%23ffffff\\' fill-opacity=\\'0.4\\' fill-rule=\\'evenodd\\'%3E%3Ccircle cx=\\'3\\' cy=\\'3\\' r=\\'3\\'/%3E%3Ccircle cx=\\'13\\' cy=\\'13\\' r=\\'3\\'/%3E%3C/g%3E%3C/svg%3E');"></div>
            <p class="text-violet-100 font-bold mb-2 text-lg relative z-10">두구두구두구... 나의 결과는?!</p>
            <h2 class="text-5xl font-black mb-4 tracking-wider relative z-10 drop-shadow-md">
              ${finalMbti}
            </h2>
            <h3 class="text-3xl font-bold relative z-10">
              ${resultData.title}
            </h3>
          </div>

          <!-- 결과 상세 내용 -->
          <div class="p-8 space-y-8">
            <!-- 강점과 약점 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100 transition-all hover:shadow-md">
                <h4 class="text-blue-800 font-bold text-xl mb-3 flex items-center">
                  <span class="bg-blue-200 w-8 h-8 rounded-full flex items-center justify-center mr-2">👍</span>
                  나의 멋진 점
                </h4>
                <p class="text-slate-700 text-lg leading-relaxed">
                  ${resultData.strengths}
                </p>
              </div>
              
              <div class="bg-rose-50 p-6 rounded-2xl border border-rose-100 transition-all hover:shadow-md">
                <h4 class="text-rose-800 font-bold text-xl mb-3 flex items-center">
                  <span class="bg-rose-200 w-8 h-8 rounded-full flex items-center justify-center mr-2">🥺</span>
                  조금 조심할 점
                </h4>
                <p class="text-slate-700 text-lg leading-relaxed">
                  ${resultData.weaknesses}
                </p>
              </div>
            </div>

            <!-- 학습 방법 & 추천 직업 -->
            <div class="bg-violet-50 p-6 rounded-2xl border border-violet-100 transition-all hover:shadow-md">
              <h4 class="text-violet-800 font-bold text-xl mb-3 flex items-center">
                <span class="bg-violet-200 w-8 h-8 rounded-full flex items-center justify-center mr-2">📚</span>
                나에게 딱 맞는 공부법
              </h4>
              <p class="text-slate-700 text-lg leading-relaxed">
                ${resultData.study}
              </p>
            </div>

            <div class="bg-amber-50 p-6 rounded-2xl border border-amber-100 transition-all hover:shadow-md">
              <h4 class="text-amber-800 font-bold text-xl mb-3 flex items-center">
                <span class="bg-amber-200 w-8 h-8 rounded-full flex items-center justify-center mr-2">⭐</span>
                어른이 되면 어울리는 직업
              </h4>
              <p class="text-slate-700 text-lg font-medium">
                ${resultData.jobs} 등
              </p>
            </div>

            <!-- 다시하기 버튼 -->
            <div class="text-center pt-4">
              <button 
                onclick="resetQuiz()"
                class="inline-flex items-center justify-center px-8 py-3 text-lg font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors rounded-full"
              >
                <i data-lucide="refresh-ccw" class="w-5 h-5 mr-2"></i>
                친구한테 추천하고 다시 하기
              </button>
            </div>
          </div>
        </div>
      `;
      appContainer.innerHTML = html;
    }

    // --- 이벤트 핸들러 함수들 ---

    function goToQuiz() {
      currentStep = 'quiz';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    // 사용자가 라디오 버튼을 클릭했을 때 호출됨
    window.handleSelect = function(questionId, value) {
      userAnswers[questionId] = value;
      errorMessage = ''; // 선택하면 에러 메시지 삭제
      
      // 상태 변경 후 전체를 다시 렌더링하지 않고, 
      // 바닐라 JS의 경우 CSS 선택자로 시각적 처리만 담당하거나, 필요한 경우에만 렌더를 부를 수 있음.
      // 여기서는 라디오 버튼의 checked 속성이 브라우저에 의해 자동 관리되므로 전체 렌더링 생략으로 성능 확보.
    };

    function calculateResult() {
      // 1. 모든 질문에 답했는지 검사
      if (Object.keys(userAnswers).length < QUESTIONS.length) {
        errorMessage = '앗! 아직 안 푼 문제가 있어요. 모든 질문에 답해주세요! 🥺';
        render(); // 에러 메시지를 띄우기 위해 리렌더링
        return;
      }

      // 2. 점수 계산 로직
      let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
      
      for (const key in userAnswers) {
        const val = userAnswers[key];
        scores[val]++;
      }

      // 3. MBTI 조합 생성
      const type = 
        (scores.E > scores.I ? 'E' : 'I') +
        (scores.S > scores.N ? 'S' : 'N') +
        (scores.T > scores.F ? 'T' : 'F') +
        (scores.J > scores.P ? 'J' : 'P');

      finalMbti = type;
      currentStep = 'result';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function resetQuiz() {
      userAnswers = {};
      finalMbti = '';
      errorMessage = '';
      currentStep = 'intro';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    // --- 앱 초기 실행 ---
    document.addEventListener('DOMContentLoaded', () => {
      render(); // 첫 화면(intro) 그리기
    });

  </script>
</body>
</html>
